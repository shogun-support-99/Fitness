name: Test and deploy

# Every push to main redeploys automatically — no manual publish step.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run app logic tests
        run: node --test "tests/*.test.js"

      - name: Verify every module parses
        run: |
          fail=0
          for f in $(find app assets scripts -name '*.js'); do
            if ! node --check "$f" 2>/tmp/err; then
              echo "SYNTAX ERROR in $f"; cat /tmp/err; fail=1
            fi
          done
          exit $fail

      - name: Verify local asset links resolve
        run: node scripts/check-links.mjs

      # Gym Visual media remains excluded. RepDB's free flat WebP stills have a
      # separate in-app licence with attribution, so they get a narrow allowlist
      # and their own provenance/path checks instead of weakening the old guard.
      - name: Assert media licences and attribution
        run: |
          set -euo pipefail
          fail=0

          echo "-- scanning the MIT data catalogue for excluded Gym Visual media --"
          if grep -rioE 'gif_url|media_id|gymvisual|\.(gif|jpe?g|png|webp|mp4|webm)"' app/data/exercises-index.json app/data/steps.*.json; then
            echo "::error::media reference found in the original generated catalogue"
            fail=1
          else
            echo "   clean: no media references in the original index or step packs"
          fi

          echo "-- scanning RepDB app data for premium, remote or unsupported media --"
          if grep -rioE 'gif_url|media_id|gymvisual|premium-samples|images/flat|https?://|\.(gif|jpe?g|png|mp4|webm|mov)"' app/data/repdb-index.json app/data/repdb-steps.*.json; then
            echo "::error::unsupported media reference found in RepDB app data"
            fail=1
          else
            echo "   clean: RepDB records use local free-tier WebP stills only"
          fi

          echo "-- allowing binary exercise media only in the licensed RepDB directory --"
          if git ls-files | grep -iE '\.(gif|jpe?g|png|webp|mp4|webm|mov)$' | grep -viE '^(assets/img/|app/icons/|app/media/repdb/)' ; then
            echo "::error::unexpected binary media outside approved artwork directories"
            fail=1
          fi
          if git ls-files app/media/repdb | grep -viE '\.webp$'; then
            echo "::error::non-WebP file in RepDB media directory"
            fail=1
          fi
          if git ls-files | grep -i 'premium-samples'; then
            echo "::error::evaluation-only premium media must not be committed"
            fail=1
          fi

          echo "-- asserting attribution and provenance are present --"
          test -f NOTICE || { echo "::error::NOTICE file missing"; fail=1; }
          test -f LICENSE-REPDB.md || { echo "::error::RepDB licence file missing"; fail=1; }
          grep -q 'hasaneyldrm/exercises-dataset' NOTICE || { echo "::error::NOTICE missing upstream credit"; fail=1; }
          grep -q 'Gym Visual' NOTICE || { echo "::error::NOTICE missing Gym Visual media exclusion"; fail=1; }
          grep -q 'Exercise data by RepDB' NOTICE || { echo "::error::NOTICE missing RepDB attribution"; fail=1; }
          grep -q 'Exercise data by' app/js/views/settings.js || { echo "::error::app settings lost visible RepDB attribution"; fail=1; }
          grep -q 'Hasan Emir' app/data/catalogue-meta.json || { echo "::error::generated metadata lost the MIT copyright notice"; fail=1; }
          grep -q 'RepDB/exercise-dataset' app/data/repdb-meta.json || { echo "::error::RepDB provenance missing"; fail=1; }

          exit $fail

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages must be enabled once, by a human, in the repository UI:
      # the REST endpoint that creates a Pages site rejects both user tokens and
      # the workflow token with "Resource not accessible by integration" on this
      # account. This step tries anyway, and if it cannot, it stops with a
      # precise instruction rather than letting configure-pages fail opaquely.
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          api="https://api.github.com/repos/$REPO/pages"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "$api")
          if [ "$code" = "200" ]; then
            echo "GitHub Pages is already enabled."
            grep -o '"html_url":"[^"]*"' /tmp/pages.json | head -1 || true
            exit 0
          fi

          echo "Pages is not enabled yet (GET returned HTTP $code). Attempting to enable it..."
          code=$(curl -s -o /tmp/enable.json -w '%{http_code}' -X POST "${auth[@]}" \
                 -d '{"build_type":"workflow"}' "$api")
          if [ "$code" = "201" ]; then
            echo "GitHub Pages enabled with Source: GitHub Actions."
            exit 0
          fi

          echo "Automatic enablement returned HTTP $code:"
          cat /tmp/enable.json 2>/dev/null | head -c 500; echo
          echo "::error title=One-time manual step required::GitHub Pages is not enabled on this repository, and the API refuses to enable it automatically. Open https://github.com/$REPO/settings/pages and set 'Build and deployment' -> Source to 'GitHub Actions'. Then re-run this workflow from the Actions tab; every later push to main will deploy on its own."
          exit 1

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
