name: Test and deploy

# Every push to main redeploys automatically — no manual publish step.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run app logic tests
        run: node --test "tests/*.test.js"

      - name: Verify every module parses
        run: |
          fail=0
          for f in $(find app assets -name '*.js' -not -path '*/node_modules/*'); do
            if ! node --check "$f" 2>/tmp/err; then
              echo "SYNTAX ERROR in $f"; cat /tmp/err; fail=1
            fi
          done
          exit $fail

      - name: Verify local asset links resolve
        run: node scripts/check-links.mjs

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
