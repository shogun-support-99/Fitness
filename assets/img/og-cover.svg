<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">IronLog — Log workouts. Get stronger.</title>
  <desc id="description">A bright workout tracker with routines, previous performance, rest timers and progress. 1,930 exercises, 11 instruction languages, no accounts.</desc>
  <rect width="1200" height="630" fill="#f5f6f8"/>
  <circle cx="1128" cy="42" r="260" fill="#e9f5fd"/>

  <!-- Product identity -->
  <g transform="translate(68 62)">
    <rect width="48" height="48" rx="13" fill="#e9f5fd"/>
    <g stroke="#1b96e8" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M11 19v10M16 14v20M32 14v20M37 19v10M16 24h16"/>
    </g>
    <text x="62" y="34" fill="#191b1f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-1">IronLog</text>
  </g>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="700" letter-spacing="-3.5">
    <text x="68" y="218" fill="#191b1f" font-size="70">Log workouts.</text>
    <text x="68" y="294" fill="#1b96e8" font-size="70">Get stronger.</text>
  </g>
  <text x="70" y="348" fill="#68717b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21">
    <tspan x="70" dy="0">Routines, previous numbers, rest timers</tspan>
    <tspan x="70" dy="31">and progress — free and offline.</tspan>
  </text>

  <g transform="translate(70 492)" font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <text y="0" fill="#191b1f" font-size="25" font-weight="700">1,930</text>
    <text y="27" fill="#68717b" font-size="15">exercises</text>
    <line x1="132" y1="-18" x2="132" y2="30" stroke="#d9dfe5"/>
    <text x="164" y="0" fill="#191b1f" font-size="25" font-weight="700">11</text>
    <text x="164" y="27" fill="#68717b" font-size="15">instruction languages</text>
    <line x1="380" y1="-18" x2="380" y2="30" stroke="#d9dfe5"/>
    <text x="412" y="0" fill="#191b1f" font-size="25" font-weight="700">0</text>
    <text x="412" y="27" fill="#68717b" font-size="15">accounts or trackers</text>
  </g>
  <text x="70" y="580" fill="#68717b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15">Stored in your browser · Works offline · MIT licensed</text>

  <!-- Workout logger -->
  <g transform="translate(716 48)">
    <rect width="424" height="534" rx="22" fill="#ffffff" stroke="#dfe4e9" stroke-width="2"/>
    <text x="26" y="44" fill="#68717b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13">Log workout</text>
    <text x="26" y="76" fill="#191b1f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700">Push Day</text>
    <rect x="318" y="28" width="80" height="40" rx="9" fill="#1b96e8"/>
    <text x="358" y="54" fill="#ffffff" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Finish</text>

    <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
      <text x="26" y="108" fill="#68717b" font-size="12">Duration</text>
      <text x="26" y="134" fill="#1b96e8" font-size="20" font-weight="650">32:14</text>
      <text x="157" y="108" fill="#68717b" font-size="12">Volume</text>
      <text x="157" y="134" fill="#191b1f" font-size="20" font-weight="650">2,423 kg</text>
      <text x="319" y="108" fill="#68717b" font-size="12">Sets</text>
      <text x="319" y="134" fill="#191b1f" font-size="20" font-weight="650">6</text>
    </g>
    <line x1="26" y1="153" x2="398" y2="153" stroke="#eceff2"/>

    <rect x="18" y="174" width="388" height="246" rx="14" fill="#ffffff" stroke="#e1e5e9"/>
    <circle cx="49" cy="207" r="17" fill="#e9f5fd"/>
    <g stroke="#1b96e8" stroke-width="2" stroke-linecap="round">
      <path d="M40 203v8M44 199v16M54 199v16M58 203v8M44 207h10"/>
    </g>
    <text x="76" y="205" fill="#0875bb" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="650">Barbell Bench Press</text>
    <text x="76" y="225" fill="#68717b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12">chest · barbell</text>

    <g fill="#68717b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing=".5">
      <text x="32" y="260">SET</text>
      <text x="80" y="260">PREVIOUS</text>
      <text x="190" y="260">KG</text>
      <text x="260" y="260">REPS</text>
      <text x="365" y="260">DONE</text>
    </g>

    <g font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15">
      <rect x="26" y="274" width="372" height="42" rx="7" fill="#e9f8ed"/>
      <text x="39" y="301" fill="#191b1f" font-weight="600">1</text>
      <text x="87" y="301" fill="#68717b">80×8</text>
      <text x="192" y="301" fill="#191b1f">85</text>
      <text x="265" y="301" fill="#191b1f">6</text>
      <rect x="358" y="281" width="30" height="30" rx="7" fill="#4bbb6b"/>
      <path d="M365 296l5 5 11-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="39" y="346" fill="#191b1f" font-weight="600">2</text>
      <text x="87" y="346" fill="#68717b">85×6</text>
      <rect x="181" y="326" width="48" height="30" rx="6" fill="#eff1f4"/>
      <text x="205" y="346" fill="#191b1f" text-anchor="middle">85</text>
      <rect x="249" y="326" width="42" height="30" rx="6" fill="#eff1f4"/>
      <text x="270" y="346" fill="#191b1f" text-anchor="middle">5</text>
      <rect x="358" y="326" width="30" height="30" rx="7" fill="#eff1f4"/>
      <path d="M365 341l5 5 11-12" fill="none" stroke="#a2abb4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="26" y="377" width="372" height="30" rx="7" fill="#eff1f4"/>
    <text x="212" y="397" fill="#3c424a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add set</text>

    <rect x="18" y="440" width="388" height="66" rx="12" fill="#f7f8fa" stroke="#e1e5e9"/>
    <circle cx="45" cy="473" r="10" fill="none" stroke="#1b96e8" stroke-width="2"/>
    <path d="M45 467v7l4 2" fill="none" stroke="#1b96e8" stroke-width="2" stroke-linecap="round"/>
    <rect x="70" y="469" width="220" height="6" rx="3" fill="#e1e5e9"/>
    <rect x="70" y="469" width="146" height="6" rx="3" fill="#1b96e8"/>
    <text x="378" y="480" fill="#1b96e8" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="end">0:48</text>
  </g>
</svg>
