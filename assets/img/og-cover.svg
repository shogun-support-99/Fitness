<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="IronLog — offline-first strength training log">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1219"/>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="78%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#c6f24e" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#c6f24e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="14%" cy="86%" r="46%">
      <stop offset="0%" stop-color="#6cc4ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6cc4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- Logo mark -->
  <g transform="translate(84 96)">
    <rect width="96" height="96" rx="24" fill="#0a0c0f" stroke="#232d3b" stroke-width="3"/>
    <g stroke="#c6f24e" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M24 38v20"/>
      <path d="M34 28v40"/>
      <path d="M62 28v40"/>
      <path d="M72 38v20"/>
      <path d="M34 48h28"/>
    </g>
    <circle cx="48" cy="48" r="5" fill="#0a0c0f" stroke="#6cc4ff" stroke-width="4"/>
  </g>

  <text x="84" y="262" fill="#e9eef5" font-family="Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-3">IronLog</text>
  <text x="84" y="318" fill="#77879a" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="0.5">Offline-first strength training log</text>

  <!-- Feature row -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
    <g transform="translate(84 384)">
      <rect width="252" height="62" rx="16" fill="#121821" stroke="#1f2937" stroke-width="2"/>
      <circle cx="34" cy="31" r="6" fill="#c6f24e"/>
      <text x="54" y="39" fill="#a9b6c6">Set &amp; rep logging</text>
    </g>
    <g transform="translate(356 384)">
      <rect width="252" height="62" rx="16" fill="#121821" stroke="#1f2937" stroke-width="2"/>
      <circle cx="34" cy="31" r="6" fill="#c6f24e"/>
      <text x="54" y="39" fill="#a9b6c6">Rest timer</text>
    </g>
    <g transform="translate(84 462)">
      <rect width="252" height="62" rx="16" fill="#121821" stroke="#1f2937" stroke-width="2"/>
      <circle cx="34" cy="31" r="6" fill="#c6f24e"/>
      <text x="54" y="39" fill="#a9b6c6">Personal records</text>
    </g>
    <g transform="translate(356 462)">
      <rect width="252" height="62" rx="16" fill="#121821" stroke="#1f2937" stroke-width="2"/>
      <circle cx="34" cy="31" r="6" fill="#c6f24e"/>
      <text x="54" y="39" fill="#a9b6c6">Zero tracking</text>
    </g>
  </g>

  <!-- Set table illustration -->
  <g transform="translate(700 250)">
    <rect width="416" height="286" rx="26" fill="#121821" stroke="#1f2937" stroke-width="2"/>
    <text x="28" y="48" fill="#e9eef5" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="800">Barbell Bench Press</text>
    <text x="28" y="76" fill="#77879a" font-family="Helvetica, Arial, sans-serif" font-size="15">chest · barbell</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      <text x="52" y="116" fill="#77879a">SET</text>
      <text x="146" y="116" fill="#77879a">KG</text>
      <text x="234" y="116" fill="#77879a">REPS</text>
      <text x="322" y="116" fill="#77879a">1RM</text>
    </g>

    <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <rect x="24" y="130" width="368" height="42" rx="11" fill="#1b2a12"/>
      <circle cx="52" cy="151" r="14" fill="#c6f24e"/>
      <text x="52" y="157" fill="#0a0c0f">1</text>
      <text x="146" y="158" fill="#e9eef5">80</text>
      <text x="234" y="158" fill="#e9eef5">8</text>
      <text x="322" y="158" fill="#6cc4ff">101</text>
      <path d="M356 145l8 8 14-16" stroke="#c6f24e" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="24" y="180" width="368" height="42" rx="11" fill="#1b2a12"/>
      <circle cx="52" cy="201" r="14" fill="#c6f24e"/>
      <text x="52" y="207" fill="#0a0c0f">2</text>
      <text x="146" y="208" fill="#e9eef5">85</text>
      <text x="234" y="208" fill="#e9eef5">6</text>
      <text x="322" y="208" fill="#6cc4ff">102</text>
      <path d="M356 195l8 8 14-16" stroke="#c6f24e" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="24" y="230" width="368" height="42" rx="11" fill="#0d1219" stroke="#1f2937" stroke-width="1.6"/>
      <circle cx="52" cy="251" r="14" fill="#1a2230"/>
      <text x="52" y="257" fill="#a9b6c6">3</text>
      <text x="146" y="258" fill="#a9b6c6">85</text>
      <text x="234" y="258" fill="#a9b6c6">5</text>
      <text x="322" y="258" fill="#77879a">99</text>
      <rect x="352" y="240" width="24" height="24" rx="7" fill="none" stroke="#2b3646" stroke-width="2.4"/>
    </g>
  </g>

  <text x="84" y="580" fill="#77879a" font-family="Helvetica, Arial, sans-serif" font-size="19">No account · No server · Free under MIT</text>
</svg>
