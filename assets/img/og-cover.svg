<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="IronLog — offline-first strength training log">
  <!--
    The same object as the landing page: a training log sheet on a bench-lit
    ground. Flat fills only — no gradient ground, no glow, no glass. Ink on
    paper, tabular figures, and the single blue on the record that broke.

    Social crawlers do not load webfonts, so this artwork uses system stacks
    rather than the self-hosted faces the site itself sets.
  -->
  <rect width="1200" height="630" fill="#141414"/>

  <!-- ── The sheet ─────────────────────────────────────────────────────── -->
  <g transform="translate(664 74)">
    <rect width="466" height="482" rx="8" fill="#f7f6f3"/>
    <rect x="0.75" y="0.75" width="464.5" height="480.5" rx="7.25" fill="none" stroke="#d9d7d0" stroke-width="1.5"/>

    <!-- Sheet head -->
    <rect x="1.5" y="1.5" width="463" height="56" rx="7" fill="#ffffff"/>
    <text x="26" y="37" fill="#0f0f0f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.2">Training log</text>
    <text x="440" y="37" fill="#6b6b6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="end">Tue 14 Oct</text>
    <line x1="1.5" y1="57.5" x2="464.5" y2="57.5" stroke="#d9d7d0" stroke-width="1.5"/>

    <!-- Exercise one -->
    <text x="26" y="94" fill="#0f0f0f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.2">Barbell Bench Press</text>
    <text x="440" y="94" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">chest · barbell</text>

    <!-- Column heads: sentence case, grey, no tracking, no band -->
    <g fill="#8a8a8a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
      <text x="26" y="124">Set</text>
      <text x="180" y="124" text-anchor="end">kg</text>
      <text x="262" y="124" text-anchor="end">Reps</text>
      <text x="392" y="124" text-anchor="end">Est 1RM</text>
    </g>
    <line x1="26" y1="133" x2="440" y2="133" stroke="#d9d7d0" stroke-width="1.5"/>

    <!-- Rows: rules and alignment, numbers right-aligned in tabular figures -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="26" y="160" fill="#8a8a8a">1</text>
      <text x="180" y="160" fill="#0f0f0f" text-anchor="end">80</text>
      <text x="262" y="160" fill="#0f0f0f" text-anchor="end">8</text>
      <text x="392" y="160" fill="#3d3d3d" text-anchor="end">101.3</text>
      <line x1="26" y1="172" x2="440" y2="172" stroke="#e2e0da" stroke-width="1"/>

      <text x="26" y="199" fill="#8a8a8a">2</text>
      <text x="180" y="199" fill="#0f0f0f" text-anchor="end">85</text>
      <text x="262" y="199" fill="#0f0f0f" text-anchor="end">6</text>
      <!-- The one hue, on the record that broke -->
      <text x="392" y="199" fill="#1d5fbf" text-anchor="end" font-weight="500">102.0</text>
      <rect x="400" y="187" width="30" height="16" rx="3" fill="#e7eef9"/>
      <text x="415" y="199" fill="#123f7f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">PR</text>
      <line x1="26" y1="211" x2="440" y2="211" stroke="#e2e0da" stroke-width="1"/>

      <text x="26" y="238" fill="#8a8a8a">3</text>
      <text x="180" y="238" fill="#0f0f0f" text-anchor="end">85</text>
      <text x="262" y="238" fill="#0f0f0f" text-anchor="end">5</text>
      <text x="392" y="238" fill="#3d3d3d" text-anchor="end">99.2</text>
      <line x1="26" y1="250" x2="440" y2="250" stroke="#d9d7d0" stroke-width="1.5"/>

      <text x="26" y="272" fill="#6b6b6b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Volume</text>
      <text x="440" y="272" fill="#6b6b6b" text-anchor="end">1,575 kg</text>
    </g>

    <!-- Ticks: drawn, in ink -->
    <g>
      <rect x="418" y="147" width="16" height="16" rx="3" fill="#0f0f0f"/>
      <path d="M422 155l3.2 3.4 5.4-6.6" stroke="#f7f6f3" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="418" y="186" width="16" height="16" rx="3" fill="#0f0f0f"/>
      <path d="M422 194l3.2 3.4 5.4-6.6" stroke="#f7f6f3" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="418" y="225" width="16" height="16" rx="3" fill="#0f0f0f"/>
      <path d="M422 233l3.2 3.4 5.4-6.6" stroke="#f7f6f3" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Exercise two -->
    <line x1="1.5" y1="292" x2="464.5" y2="292" stroke="#d9d7d0" stroke-width="1.5"/>
    <text x="26" y="328" fill="#0f0f0f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.2">Incline Dumbbell Press</text>
    <text x="440" y="328" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" text-anchor="end">chest · dumbbell</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="26" y="362" fill="#8a8a8a">1</text>
      <text x="180" y="362" fill="#0f0f0f" text-anchor="end">32</text>
      <text x="262" y="362" fill="#0f0f0f" text-anchor="end">10</text>
      <text x="392" y="362" fill="#3d3d3d" text-anchor="end">42.7</text>
      <line x1="26" y1="374" x2="440" y2="374" stroke="#e2e0da" stroke-width="1"/>

      <text x="26" y="401" fill="#8a8a8a">2</text>
      <text x="180" y="401" fill="#0f0f0f" text-anchor="end">32</text>
      <text x="262" y="401" fill="#0f0f0f" text-anchor="end">9</text>
      <text x="392" y="401" fill="#3d3d3d" text-anchor="end">41.6</text>
    </g>
    <g>
      <rect x="418" y="349" width="16" height="16" rx="3" fill="#0f0f0f"/>
      <path d="M422 357l3.2 3.4 5.4-6.6" stroke="#f7f6f3" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="418" y="388" width="16" height="16" rx="3" fill="#0f0f0f"/>
      <path d="M422 396l3.2 3.4 5.4-6.6" stroke="#f7f6f3" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Rest timer: a thin flat rule, no glow -->
    <line x1="1.5" y1="420" x2="464.5" y2="420" stroke="#d9d7d0" stroke-width="1.5"/>
    <text x="26" y="449" fill="#6b6b6b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5">Rest</text>
    <rect x="76" y="443" width="300" height="3" rx="1.5" fill="#efeeea"/>
    <rect x="76" y="443" width="186" height="3" rx="1.5" fill="#1d5fbf"/>
    <text x="440" y="449" fill="#0f0f0f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">0:48</text>

    <!-- Sheet foot -->
    <line x1="1.5" y1="466" x2="464.5" y2="466" stroke="#d9d7d0" stroke-width="1.5"/>
    <text x="26" y="478" fill="#6b6b6b" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Session total 2,423 kg across 6 sets</text>
  </g>

  <!-- ── Left column: name, claim, facts ───────────────────────────────── -->
  <g transform="translate(84 118)">
    <!-- The mark: the object, drawn as ledger geometry -->
    <rect width="62" height="62" rx="8" fill="#f7f6f3"/>
    <g stroke="#0f0f0f" stroke-width="4.4" stroke-linecap="round" fill="none">
      <path d="M15.5 25v12"/>
      <path d="M22.4 18.4v25.2"/>
      <path d="M39.6 18.4v25.2"/>
      <path d="M46.5 25v12"/>
      <path d="M22.4 31h17.2"/>
    </g>
    <rect x="28.2" y="26.8" width="5.6" height="8.4" rx="1.4" fill="#1d5fbf"/>
  </g>

  <text x="84" y="264" fill="#f4f4f4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="-2.6">IronLog</text>
  <text x="84" y="308" fill="#a3a3a3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" letter-spacing="-0.3">The strength training log that stays yours.</text>

  <line x1="84" y1="348" x2="580" y2="348" stroke="#2b2b2b" stroke-width="1"/>

  <!-- Facts as a sentence with mono figures, not a row of metric tiles -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#a3a3a3">
    <text x="84" y="392">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#f4f4f4">1,388</tspan> exercises
    </text>
    <text x="84" y="428">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#f4f4f4">10</tspan> instruction languages
    </text>
    <text x="84" y="464">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#f4f4f4">0</tspan> accounts, trackers or servers
    </text>
  </g>

  <line x1="84" y1="504" x2="580" y2="504" stroke="#2b2b2b" stroke-width="1"/>
  <text x="84" y="546" fill="#7d7d7d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16">Free · Works offline · MIT licensed</text>
</svg>
