<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IronLog — Strength training log</title>
    <meta
      name="description"
      content="IronLog is an offline-first strength training log. Track exercises, sets, volume, rest and personal records. No account, no server, no tracking."
    />
    <meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="./" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/img/logo.svg" />

    <!-- Both faces are self-hosted under the SIL Open Font License, so the
         page makes no third-party request. Preloaded because the ledger's
         figures are set in the mono face and a late swap would jitter them. -->
    <link rel="preload" href="../fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/app.css" />
    <script type="module" src="./js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#view-outlet">Skip to content</a>

    <div class="shell">
      <aside class="sidebar" aria-label="Primary">
        <a class="brand" href="#/home" aria-label="IronLog home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M6 12v8M10 8v16M22 8v16M26 12v8M10 16h12" />
            </svg>
          </span>
          <span class="brand-name">IronLog</span>
        </a>

        <nav class="nav">
          <a class="nav-item" data-route="home" href="#/home" aria-label="Home">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5" /></svg>
            </span>
            Home
          </a>
          <a class="nav-item" data-route="workout" href="#/workout" aria-label="Logger">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" /></svg>
            </span>
            Logger
          </a>
          <a class="nav-item" data-route="history" href="#/history" aria-label="History">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4.5V10h5.5M12 7.5V12l3 1.8" /></svg>
            </span>
            History
          </a>
          <a class="nav-item" data-route="stats" href="#/stats" aria-label="Progress">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2" /></svg>
            </span>
            Progress
          </a>
          <a class="nav-item" data-route="library" href="#/library" aria-label="Library">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 5.5h7v13H4zM13 5.5h7v13h-7z" /></svg>
            </span>
            Library
          </a>
          <a class="nav-item" data-route="settings" href="#/settings" aria-label="Settings">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm8.4-3.2 1.9-1.5-1.9-3.3-2.3.7a7.6 7.6 0 0 0-1.6-.9L14.1 4h-4l-.4 2.5c-.6.2-1.1.5-1.6.9l-2.3-.7-1.9 3.3 1.9 1.5a7.9 7.9 0 0 0 0 1.8L3.9 15l1.9 3.3 2.3-.7c.5.4 1 .7 1.6.9l.4 2.5h4l.4-2.5c.6-.2 1.1-.5 1.6-.9l2.3.7 1.9-3.3-1.9-1.5a7.9 7.9 0 0 0 0-1.8Z" /></svg>
            </span>
            Settings
          </a>
        </nav>

        <div class="sidebar-foot">
          <a class="link-muted" href="../" aria-label="Landing page">Landing page</a>
          <p class="storage-note">Stored in this browser</p>
        </div>
      </aside>

      <main class="main" id="view-outlet" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Primary mobile">
        <span class="tabbar-indicator" aria-hidden="true"></span>
        <a class="nav-item" data-route="home" href="#/home">Home</a>
        <a class="nav-item" data-route="workout" href="#/workout">Log</a>
        <a class="nav-item" data-route="history" href="#/history">History</a>
        <a class="nav-item" data-route="stats" href="#/stats">Progress</a>
        <a class="nav-item" data-route="library" href="#/library">Library</a>
      </nav>
    </div>

    <div id="toast-host" aria-live="polite"></div>

    <!--
      Celebration announcer. The stamp and ray burst in motion.js are visual;
      this is the same event for assistive tech. Polite, not assertive: a new
      personal record is worth interrupting a rest timer for, not worth
      interrupting a screen reader mid-word.
    -->
    <div id="ironlog-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
